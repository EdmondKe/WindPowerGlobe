# 發布風車地球到 GitHub Pages，並在發布前下載最新的 NOAA GFS 即時風場和 GDACS 全球颱風路徑。
# 觸發時機：推送到 main、每 6 小時（GFS 00/06/12/18Z 起報後約 4.5 小時，資料才會出齊）、或在 Actions 頁面手動執行。
# 風場檔（data/wind.bin.gz）只放進發布的網站，不 commit 進 repo，歷史紀錄才不會越來越大。
name: 發布網站（含即時風場、颱風）

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 下載最新風場（失敗時網站自動改用模擬風場）
        run: python tools/build_wind.py
        continue-on-error: true

      - name: 下載全球颱風路徑（失敗時沿用 repo 裡的 data/typhoons.json）
        run: python tools/build_typhoons.py
        continue-on-error: true

      # 小幫手的語音：沿用上次錄好的檔案（快取），只補錄新增的句子；失敗時網站改用裝置內建語音
      - uses: actions/cache@v6
        with:
          path: voice
          key: voice-${{ github.run_id }}
          restore-keys: voice-

      - name: 錄製小幫手語音
        run: pip install edge-tts && python tools/build_voice.py
        continue-on-error: true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # 同一份網站也發布到 Cloudflare Pages（https://windpowerglobe.pages.dev，網域 https://windpowerglobe.com 接在這裡）。
      # 要先在 repo 的 Settings → Secrets and variables → Actions 加上 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID，沒設定就跳過。
      - name: 整理要發布到 Cloudflare 的檔案
        if: env.CF_TOKEN != ''
        run: |
          mkdir _cf
          cp -r index.html manifest.webmanifest assets data Music _cf/
          if [ -d voice ]; then cp -r voice _cf/; fi

      - name: 建立 Cloudflare Pages 專案（只有第一次需要，已經有了會略過）
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create windpowerglobe --production-branch=main

      - name: 發布到 Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _cf --project-name=windpowerglobe --branch=main --commit-dirty=true

      # 舊網址 wind-globe.pages.dev 自動轉到 windpowerglobe.com（舊專案只放轉址設定）
      - name: 舊網址轉到新網址
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tools/redirect-old --project-name=wind-globe --branch=main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
